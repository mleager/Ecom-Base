# Opt-in TLS for the local PostgreSQL container (Milestone 14, task 6).
#
#   bash scripts/certs.sh            # once: creates .cache/certs/
#   bash scripts/dev.sh database-tls # starts PostgreSQL with this override
#   bash scripts/dev.sh database     # back to the default (no TLS)
#
# Only the database certificate and key are mounted; the CA key never enters
# the container. PostgreSQL refuses a key that is not 0600 and owned by its
# user, so the entrypoint copies both files into the container (as root) with
# the right owner and mode before starting the normal image entrypoint.
#
# TLS is offered, not required: pg_hba still accepts non-TLS loopback
# connections, so URLs with sslmode=disable keep working. Clients that need
# proof use sslmode=verify-full&sslrootcert=.cache/certs/ca.pem.
services:
  postgres:
    volumes:
      - ./.cache/certs/postgres.pem:/run/ecom-tls/server.crt:ro
      - ./.cache/certs/postgres.key:/run/ecom-tls/server.key:ro
    entrypoint:
      - /bin/sh
      - -c
      - >-
        install -d -o postgres -g postgres -m 0700 /var/lib/postgresql/tls &&
        install -o postgres -g postgres -m 0644 /run/ecom-tls/server.crt /var/lib/postgresql/tls/server.crt &&
        install -o postgres -g postgres -m 0600 /run/ecom-tls/server.key /var/lib/postgresql/tls/server.key &&
        exec docker-entrypoint.sh "$$@"
      - docker-entrypoint
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
