# Client authentication for the deployment profile (compose.deploy.yaml).
# Inside the container, the local socket serves initdb, the init script and
# pg_isready. Every network connection must use TLS and SCRAM; there is no
# plain "host" rule, so a client with sslmode=disable is refused.
# TYPE   DATABASE  USER  ADDRESS  METHOD
local    all       all            scram-sha-256
hostssl  all       all   all      scram-sha-256
