# Client authentication for the deployment profile (compose.deploy.yaml).
# Inside the container, the local socket serves initdb, the init script,
# pg_isready and operator psql. Over the network only the application roles
# may connect, only to ecom, and only with TLS and SCRAM: there is no plain
# "host" rule, so a client with sslmode=disable is refused, and postgres (the
# superuser) can't connect over the network at all.
# TYPE   DATABASE  USER                    ADDRESS  METHOD
local    all       all                              scram-sha-256
hostssl  ecom      ecom_migrator,ecom_app  all      scram-sha-256
