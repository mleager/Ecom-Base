openapi: 3.0.3
info:
  title: Commerce Reliability Lab - planned M13 addendum
  version: 1.7.0-design.1
  description: >-
    Milestone 13 design handoff. The implemented 23 guest operations and admin list
    extension are documented in openapi.yaml (1.7.0, readiness 13). Lifecycle, scope,
    privacy and migration rules are in ../backend/GUEST_COMMERCE_DESIGN.md.
    Strict JSON, no null/unknown/duplicate fields, 64-KiB bodies, no-store responses.
    Cookie-only operations reject bearer headers; only cart-choice intentionally
    combines bearer and guest cookie. No write renews or replays automatically.
x-contract-status: design-only
x-implemented-contract: ./openapi.yaml
servers:
  - url: http://localhost:8080/api/v1
security:
  - guestCookie: []
x-browser-write-parameters: &write
  - $ref: './openapi.yaml#/components/parameters/BrowserOrigin'
  - $ref: './openapi.yaml#/components/parameters/CsrfProtection'
x-common-errors: &errors
  '400': { $ref: './openapi.yaml#/components/responses/BadRequest' }
  '401': { $ref: './openapi.yaml#/components/responses/Unauthorized' }
  '403': { $ref: './openapi.yaml#/components/responses/Forbidden' }
  '409': { $ref: '#/components/responses/Conflict' }
  '413': { $ref: './openapi.yaml#/components/responses/PayloadTooLarge' }
  '422': { $ref: './openapi.yaml#/components/responses/Unprocessable' }
  '429': { $ref: './openapi.yaml#/components/responses/TooManyRequests' }
  '500': { $ref: './openapi.yaml#/components/responses/InternalServerError' }
  '503': { $ref: '#/components/responses/Unavailable' }
paths:
  /guest/session:
    get:
      operationId: getGuestSession
      x-implementation-task: 4
      description: Verify full guest cookie; never creates, rotates or sets cookies. Invalid/missing/expired is 401.
      responses:
        <<: *errors
        '200': { $ref: '#/components/responses/Session' }
    post:
      operationId: createGuestSession
      x-implementation-task: 4
      security: []
      description: >-
        Bodyless, explicit bootstrap. Missing cookie creates 201; a valid full cookie
        returns the same principal/deadline with 200. Invalid/duplicate supplied cookie
        returns 401, never replacement. Creation sets only ecom_guest.
      parameters: *write
      responses:
        <<: *errors
        '200': { $ref: '#/components/responses/Session' }
        '201': { $ref: '#/components/responses/Session' }
    delete:
      operationId: endGuestSession
      x-implementation-task: 4
      security: []
      description: Bodyless; deliberately revoke/clear only presented full guest cookie, even absent/expired/unrecognized; duplicate cookies fail closed. Preserve intents and unrelated cookies.
      parameters: *write
      responses:
        <<: *errors
        '204': { description: Guest session ended; repeated missing-session end is also 204 }
  /guest/session/rotate:
    post:
      operationId: rotateGuestSession
      x-implementation-task: 4
      description: Bodyless; replace full verifier, preserving guest/cart/absolute deadline. No automatic replay.
      parameters: *write
      responses:
        <<: *errors
        '200': { $ref: '#/components/responses/Session' }
  /guest/cart:
    get:
      operationId: getGuestCart
      x-implementation-task: 4
      description: Full credential only; consistent parent-locked cart, never creates or accepts recovery scope.
      responses:
        <<: *errors
        '200': { $ref: '#/components/responses/Cart' }
  /guest/cart/items:
    post:
      operationId: addGuestCartItem
      x-implementation-task: 4
      description: Deliberate additive mutation; 100 lines/10000 quantity, no reservation or stock cap.
      parameters: *write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartAdd' }
      responses:
        <<: *errors
        '200': { $ref: '#/components/responses/Cart' }
    delete:
      operationId: clearGuestCart
      x-implementation-task: 4
      description: Bodyless; clear owned cart and increment once; explicit fresh read after 204.
      parameters: *write
      responses:
        <<: *errors
        '204': { description: Cart cleared }
  /guest/cart/items/{id}:
    parameters:
      - $ref: './openapi.yaml#/components/parameters/Id'
      - $ref: './openapi.yaml#/components/parameters/BrowserOrigin'
      - $ref: './openapi.yaml#/components/parameters/CsrfProtection'
    patch:
      operationId: replaceGuestCartItem
      x-implementation-task: 4
      description: Full credential, owned item ID, resulting quantity. No automatic replay.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartReplacement' }
      responses:
        <<: *errors
        '200': { $ref: '#/components/responses/Cart' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: removeGuestCartItem
      x-implementation-task: 4
      description: Bodyless; owned item only, including unavailable products; explicit read after 204.
      responses:
        <<: *errors
        '204': { description: Item removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /guest/cart-choice:
    get:
      operationId: getGuestCartChoice
      x-implementation-task: 4
      security: [{ bearerAuth: [], guestCookie: [] }]
      description: Requires both current account session and full guest cookie; no transfer by GET.
      responses:
        <<: *errors
        '200':
          description: Current session/guest cart choice and versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartChoiceStatus' }
    post:
      operationId: chooseGuestCart
      x-implementation-task: 4
      security: [{ bearerAuth: [], guestCookie: [] }]
      description: >-
        keep_account changes no cart. use_guest atomically replaces account contents
        with guest lines and clears guest cart; never merges/reparents orders.
        Expected-version conflict is 409 cart_choice_conflict; unresolved guest intent
        blocks transfer with guest_checkout_unresolved. Uncertain writes require readback.
      parameters: *write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartChoiceInput' }
      responses:
        <<: *errors
        '200':
          description: Durable choice receipt and current account cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartChoiceResult' }
  /guest/checkout-intents:
    post:
      operationId: prepareGuestCheckout
      x-implementation-task: 5
      description: >-
        Save reference locally first. Immutable server shipping/contact preparation,
        NOT order creation, payment or stock reservation. Identical same-key preparation
        returns 200, new 201, changed body/key binding 409 idempotency_conflict.
        One prepared intent per guest; retired IDs cannot be resurrected.
      parameters:
        - $ref: './openapi.yaml#/components/parameters/BrowserOrigin'
        - $ref: './openapi.yaml#/components/parameters/CsrfProtection'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestPreparation' }
      responses:
        <<: *errors
        '200': { $ref: '#/components/responses/Intent' }
        '201': { $ref: '#/components/responses/Intent' }
  /guest/checkout-intents/{id}:
    parameters: [{ $ref: '#/components/parameters/IntentId' }]
    get:
      operationId: getGuestCheckoutIntent
      x-implementation-task: 5
      security: [{ guestCookie: [] }, { guestRecoveryCookie: [] }]
      description: >-
        Owned original preparation, committed locator or closed state. Recovery grant
        must match this exact intent. 404 does not prove a delayed preparation/checkout
        cannot commit; explicit retirement is the fence.
      responses:
        <<: *errors
        '200': { $ref: '#/components/responses/Intent' }
        '404': { $ref: '#/components/responses/NotFound' }
  /guest/checkout-intents/{id}/retire:
    parameters: [{ $ref: '#/components/parameters/IntentId' }]
    post:
      operationId: retireGuestCheckoutIntent
      x-implementation-task: 5
      security: [{ guestCookie: [] }, { guestRecoveryCookie: [] }]
      description: >-
        Explicit original-key retirement under owner/key locks. Returns matching committed
        order instead of closing it; otherwise commits retired state, including a tombstone
        for missing preparation with a full owner credential. Late messages cannot resurrect.
        Recovery scope must match the existing target. Uncertainty preserves local record.
      parameters:
        - $ref: './openapi.yaml#/components/parameters/BrowserOrigin'
        - $ref: './openapi.yaml#/components/parameters/CsrfProtection'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        <<: *errors
        '200':
          description: Authoritative retirement or known-order handoff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestRetirement' }
  /guest/checkout:
    post:
      operationId: checkoutGuest
      x-implementation-task: 5
      security: [{ guestCookie: [] }, { guestRecoveryCookie: [] }]
      description: >-
        Full owner or exact intent recovery scope. Same original key/reference/body only;
        committed lookup precedes current-cart/expired-intent refusal. Reuses T1/claim/T2.
        Replay never restarts interrupted processing. Save durable known-order before
        navigation; 200/201 may contain payment_failed and 202 contains pending_payment.
      parameters:
        - $ref: './openapi.yaml#/components/parameters/BrowserOrigin'
        - $ref: './openapi.yaml#/components/parameters/CsrfProtection'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestCheckoutReference' }
      responses:
        <<: *errors
        '200': { $ref: '#/components/responses/Order' }
        '201': { $ref: '#/components/responses/Order' }
        '202': { $ref: '#/components/responses/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: './openapi.yaml#/components/responses/CheckoutOutcomeUncertain' }
  /guest/orders:
    get:
      operationId: listGuestOrders
      x-implementation-task: 5
      description: Full guest credential only; newest created_at/id first. Recovery scope cannot list history.
      parameters:
        - $ref: './openapi.yaml#/components/parameters/Limit'
        - $ref: './openapi.yaml#/components/parameters/Offset'
      responses:
        <<: *errors
        '200':
          description: Owned guest orders, unchanged Order snapshots
          content:
            application/json:
              schema: { type: array, maxItems: 100, items: { $ref: './openapi.yaml#/components/schemas/Order' } }
  /guest/orders/{id}:
    parameters: [{ $ref: './openapi.yaml#/components/parameters/Id' }]
    get:
      operationId: getGuestOrder
      x-implementation-task: 5
      security: [{ guestCookie: [] }, { guestRecoveryCookie: [] }]
      description: Full owner or exact order/result-of-intent scope, not email or order ID as authorization.
      responses:
        <<: *errors
        '200': { $ref: '#/components/responses/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
  /guest/orders/{id}/payments:
    parameters: [{ $ref: './openapi.yaml#/components/parameters/Id' }]
    get:
      operationId: getGuestOrderPayments
      x-implementation-task: 5
      security: [{ guestCookie: [] }, { guestRecoveryCookie: [] }]
      description: Same exact ownership/scope as order detail; one simulated attempt, no payment actions.
      responses:
        <<: *errors
        '200':
          description: Authoritative attempts
          content:
            application/json:
              schema: { type: array, minItems: 1, maxItems: 1, items: { $ref: './openapi.yaml#/components/schemas/PaymentAttempt' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /guest/orders/{id}/cancel:
    parameters: [{ $ref: './openapi.yaml#/components/parameters/Id' }]
    post:
      operationId: cancelGuestOrder
      x-implementation-task: 5
      security: [{ guestCookie: [] }, { guestRecoveryCookie: [] }]
      description: Bodyless; same existing pending-only/claim conflict rules. Explicit same-order retry only.
      parameters: *write
      responses:
        <<: *errors
        '200': { $ref: '#/components/responses/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: './openapi.yaml#/components/responses/OrderOutcomeUncertain' }
  /guest/recovery-requests:
    post:
      operationId: requestGuestRecovery
      x-implementation-task: 5
      security: []
      description: >-
        Non-disclosing email+one-reference request. Always same 202 body/8s response
        floor for eligible/ineligible/target quota suppression, no target details.
        Global delivery-off 503/peer 429 are eligibility-independent. No cookies changed.
        Fifteen-minute single-use proof; trusted-origin /guest/recover#token= link.
      parameters: *write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestRecoveryRequest' }
      responses:
        <<: *errors
        '202':
          description: Generic receipt, not proof of delivery or existence
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message]
                properties:
                  message: { type: string, enum: ['If the reference and email are eligible, recovery instructions will be sent.'] }
  /guest/recovery-confirmations:
    post:
      operationId: confirmGuestRecovery
      x-implementation-task: 5
      security: []
      description: >-
        Consume one proof, issue 30-minute exact-target ecom_guest_recovery cookie.
        No login/full-guest/cart/account grant or unrelated-cookie changes. All invalid
        proofs return 400 invalid_guest_proof; lost reply uses GET recovery-access or
        a new requested proof, never automatic token replay. GET consumes nothing.
      parameters: *write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
      responses:
        <<: *errors
        '200': { $ref: '#/components/responses/RecoveryAccess' }
  /guest/recovery-access:
    get:
      operationId: getGuestRecoveryAccess
      x-implementation-task: 5
      security: [{ guestRecoveryCookie: [] }]
      description: Verify current exact-target grant; no extension, cookie issuance or full-owner restoration.
      responses:
        <<: *errors
        '200': { $ref: '#/components/responses/RecoveryAccess' }
    delete:
      operationId: endGuestRecoveryAccess
      x-implementation-task: 5
      security: []
      description: Bodyless; revoke/clear only the recovery grant; missing grant also 204.
      parameters: *write
      responses:
        <<: *errors
        '204': { description: Recovery access ended }
  /admin/products:
    get:
      operationId: listAdminProducts
      x-implementation-task: 4
      security: [{ bearerAuth: [] }]
      description: >-
        Planned extension of existing GET, not a new route. Current admin role;
        q/is_active/limit/offset once each, valid encoding. Reuse trimmed valid-Unicode,
        no-NUL, at-most-200-code-point literal case-insensitive name OR SKU substring
        matching across full eligible dataset before pagination; escape ! % _ with
        ESCAPE '!'. Preserve name/UUID ordering and missing-inventory safe failure.
        Blank q means no text filter. Malformed query 400, bounds/text 422.
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 200 }
        - in: query
          name: is_active
          schema: { type: boolean }
        - $ref: './openapi.yaml#/components/parameters/Limit'
        - $ref: './openapi.yaml#/components/parameters/Offset'
      responses:
        <<: *errors
        '200':
          description: Eligible page, no total/count contract
          content:
            application/json:
              schema: { type: array, maxItems: 100, items: { $ref: './openapi.yaml#/components/schemas/Product' } }
components:
  securitySchemes:
    bearerAuth: { $ref: './openapi.yaml#/components/securitySchemes/bearerAuth' }
    guestCookie:
      type: apiKey
      in: cookie
      name: ecom_guest
      description: Host-only HttpOnly SameSite=Strict Path=/api/v1/guest; Secure in production; fixed 30 days, random opaque secret.
    guestRecoveryCookie:
      type: apiKey
      in: cookie
      name: ecom_guest_recovery
      description: Same protections; 30-minute single-target grant, never full cart/history authority.
  parameters:
    IntentId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UUIDv4' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Original crypto.randomUUID key, distinct from intent/generation; immutable, never replaced to bypass uncertainty.
      schema: { type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
  responses:
    Conflict:
      description: Verified conflict code; generic 409 alone does not authorize intent retirement.
      content:
        application/json:
          schema: { $ref: './openapi.yaml#/components/schemas/Error' }
    NotFound:
      description: not_found, order_not_found or checkout_intent_not_found; never disclose another owner; not proof of rollback.
      content:
        application/json:
          schema: { $ref: './openapi.yaml#/components/schemas/Error' }
    Unavailable:
      description: Admission/delivery unavailable or outcome unknown; preserve state and do not automatically replay.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1, maximum: 3600 } }
      content:
        application/json:
          schema: { $ref: './openapi.yaml#/components/schemas/Error' }
    Session:
      description: Verified guest principal/deadline; secret only in Set-Cookie on create/rotate, never JSON.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GuestSession' }
    Cart:
      description: Consistent current owned cart snapshot
      content:
        application/json:
          schema: { $ref: './openapi.yaml#/components/schemas/Cart' }
    Order:
      description: Validated authoritative owned Order; status determines payment outcome, not HTTP success.
      content:
        application/json:
          schema: { $ref: './openapi.yaml#/components/schemas/Order' }
    Intent:
      description: Original preparation or authoritative known/closed intent status
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GuestIntentStatus' }
    RecoveryAccess:
      description: Verified exact target/deadline; credential only in Set-Cookie on confirmation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RecoveryAccess' }
  schemas:
    UUIDv4:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    GuestSession:
      type: object
      additionalProperties: false
      required: [guest_id, expires_at]
      properties:
        guest_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
    CartAdd:
      type: object
      additionalProperties: false
      required: [product_id, quantity]
      properties:
        product_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 10000 }
    CartReplacement:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 10000 }
    CartChoiceInput:
      type: object
      additionalProperties: false
      required: [choice, guest_cart_version, account_cart_version]
      properties:
        choice: { type: string, enum: [keep_account, use_guest] }
        guest_cart_version: { $ref: './openapi.yaml#/components/schemas/Cart/properties/version' }
        account_cart_version: { $ref: './openapi.yaml#/components/schemas/Cart/properties/version' }
    CartChoiceStatus:
      type: object
      additionalProperties: false
      required: [required, guest_cart_version, account_cart_version]
      properties:
        required: { type: boolean }
        guest_cart_version: { $ref: './openapi.yaml#/components/schemas/Cart/properties/version' }
        account_cart_version: { $ref: './openapi.yaml#/components/schemas/Cart/properties/version' }
        choice: { type: string, enum: [keep_account, use_guest] }
    CartChoiceResult:
      type: object
      additionalProperties: false
      required: [choice, cart]
      properties:
        choice: { type: string, enum: [keep_account, use_guest] }
        cart: { $ref: './openapi.yaml#/components/schemas/Cart' }
    GuestShipping:
      type: object
      additionalProperties: false
      required: [recipient_name, line_1, city, region, postal_code, country_code]
      properties:
        recipient_name: { $ref: './openapi.yaml#/components/schemas/AddressInput/properties/recipient_name' }
        line_1: { $ref: './openapi.yaml#/components/schemas/AddressInput/properties/line_1' }
        line_2: { $ref: './openapi.yaml#/components/schemas/AddressInput/properties/line_2' }
        city: { $ref: './openapi.yaml#/components/schemas/AddressInput/properties/city' }
        region: { $ref: './openapi.yaml#/components/schemas/AddressInput/properties/region' }
        postal_code: { $ref: './openapi.yaml#/components/schemas/AddressInput/properties/postal_code' }
        country_code: { type: string, enum: [US] }
    GuestPreparation:
      type: object
      additionalProperties: false
      required: [id, cart_version, payment_scenario, contact_email, shipping_address]
      properties:
        id: { $ref: '#/components/schemas/UUIDv4' }
        cart_version: { $ref: './openapi.yaml#/components/schemas/Cart/properties/version' }
        payment_scenario: { type: string, enum: [accept, reject] }
        contact_email: { type: string, format: email, maxLength: 254, description: Existing canonicalization; maximum 254 UTF-8 bytes }
        shipping_address: { $ref: '#/components/schemas/GuestShipping' }
    GuestCheckoutReference:
      type: object
      additionalProperties: false
      required: [cart_version, checkout_intent_id, payment_scenario]
      properties:
        cart_version: { $ref: './openapi.yaml#/components/schemas/Cart/properties/version' }
        checkout_intent_id: { $ref: '#/components/schemas/UUIDv4' }
        payment_scenario: { type: string, enum: [accept, reject] }
    GuestIntentStatus:
      oneOf:
        - $ref: '#/components/schemas/PreparedGuestIntent'
        - $ref: '#/components/schemas/KnownGuestIntent'
        - $ref: '#/components/schemas/ClosedGuestIntent'
    PreparedGuestIntent:
      type: object
      additionalProperties: false
      required: [id, guest_id, state, idempotency_key, request, contact_email, shipping_address, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        guest_id: { type: string, format: uuid }
        state: { type: string, enum: [prepared] }
        idempotency_key: { type: string, format: uuid }
        request: { $ref: '#/components/schemas/GuestCheckoutReference' }
        contact_email: { type: string, format: email, maxLength: 254 }
        shipping_address: { $ref: '#/components/schemas/GuestShipping' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    KnownGuestIntent:
      type: object
      additionalProperties: false
      required: [id, guest_id, state, order_id]
      properties:
        id: { type: string, format: uuid }
        guest_id: { type: string, format: uuid }
        state: { type: string, enum: [known_order] }
        order_id: { type: string, format: uuid }
    ClosedGuestIntent:
      type: object
      additionalProperties: false
      required: [id, guest_id, state]
      properties:
        id: { type: string, format: uuid }
        guest_id: { type: string, format: uuid }
        state: { type: string, enum: [rejected, retired, expired] }
    GuestRetirement:
      oneOf:
        - type: object
          additionalProperties: false
          required: [state]
          properties:
            state: { type: string, enum: [retired] }
        - type: object
          additionalProperties: false
          required: [state, order]
          properties:
            state: { type: string, enum: [known_order] }
            order: { $ref: './openapi.yaml#/components/schemas/Order' }
    GuestRecoveryRequest:
      type: object
      additionalProperties: false
      required: [contact_email]
      properties:
        contact_email: { type: string, format: email, maxLength: 254, description: Existing canonicalization and maximum 254 UTF-8 bytes }
        checkout_intent_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
      oneOf:
        - required: [checkout_intent_id]
          not: { required: [order_id] }
        - required: [order_id]
          not: { required: [checkout_intent_id] }
    RecoveryAccess:
      type: object
      additionalProperties: false
      required: [guest_id, scope, target_id, expires_at]
      properties:
        guest_id: { type: string, format: uuid }
        scope: { type: string, enum: [checkout_intent, order] }
        target_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
