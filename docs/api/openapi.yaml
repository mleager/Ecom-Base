      description: keep_account changes no cart. use_guest atomically replaces account contents with guest lines and
        clears guest cart; never merges/reparents orders. Expected-version conflict is 409 cart_choice_conflict; unresolved
        guest intent blocks transfer with guest_checkout_unresolved. Uncertain writes require readback.
      parameters:
      - $ref: '#/components/parameters/BrowserOrigin'
      - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
