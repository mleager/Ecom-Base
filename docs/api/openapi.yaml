          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestCartChoiceResult'
      tags:
      - Guest
  /auth/password-resets:
    post:
      tags: [Auth]
      security: []
      operationId: requestPasswordReset
      description: >-
        Public recovery request; browser credentials are omitted. Requires exact
        Origin and CSRF header, but no bearer token or current password. Does not
        read, set or clear cookies. Active accounts with verified current email are
        eligible. All valid admitted requests return the identical 202 receipt at
        five seconds, including unknown/inactive/unverified addresses, account/address
        suppression, lookup failures and unconfirmed delivery. Work ends within four
        seconds; cancellation releases admission. At most 32 concurrent admitted
        requests; global saturation returns 503 with Retry-After 5 before lookup.
        Disabled mail returns 503 for every address. Peer-IP admission is 20/minute;
        SHA-256 address suppression and durable account issuance are three/hour.
        At most three live 15-minute links; a new request preserves earlier links.
        Links use the configured frontend origin and /reset-password#token= fragment.
        No automatic retries or delivery guarantees; check the mailbox deliberately.
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: Non-disclosing recovery receipt; independent of delivery or eligibility
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: Global admission saturation or email_delivery_unavailable; independent of address eligibility
          headers:
            Retry-After:
              description: Five seconds for admission saturation
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/password-resets/confirm:
    post:
      tags: [Auth]
      security: []
      operationId: confirmPasswordReset
      description: >-
        Public single-use recovery redemption, requiring exact Origin and CSRF header.
        Browser credentials are omitted; ignores bearer/cookies and never changes
        cookies, including for an unrelated signed-in account. Atomically consumes a
        current verified-email/version-bound reset proof, replaces the password,
        increments credential version, invalidates all security proofs, cancels pending
        email changes and revokes every session of the target account. No automatic
        login or tokens. Password must differ from the current password and retains
        whitespace. Invalid/expired/used/wrong-purpose or stale-bound proofs all return
        400 invalid_security_token. GET never consumes a proof. Peer admission is
        20/minute and SHA-256 token admission five/minute. Notification is best effort
        after a known commit; accepted means SMTP acceptance, unconfirmed may still
        arrive. Never automatically repeat the mutation after a lost reply or 503;
        deliberately sign in to check. Successful clients broadcast only security-changed
        and recheck cookie/profile state under same-origin coordination, preserving
        unrelated sessions. Existing revoked cookies are harmless and remain until
        normal login replaces them or explicit logout clears them.
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetInput' }
      responses:
        '200':
          description: Password reset; every target session revoked; deliberate login required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: credential_version_exhausted; no mutation applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: security_unavailable or security_outcome_unknown; do not assume rollback or retry automatically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/register:
    post:
      tags: [Auth]
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Account registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      description: >-
        Sets a host-only ecom_refresh cookie with HttpOnly, SameSite=Strict,
        Path=/api/v1/auth, and Secure in HTTPS deployments. Only explicit localhost
        HTTP development permits Secure=false. Access JWT lifetime is 900 seconds;
        refresh sessions have a fixed seven-day maximum lifetime.
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Access token and refresh cookie
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /auth/refresh:
    post:
      tags: [Auth]
      security:
        - refreshCookie: []
      operationId: refresh
      description: >-
        Atomically rotates the HttpOnly refresh cookie without extending the original
        session expiry. Concurrent refresh permits one winner; stale tokens return
        401 without clearing a concurrently renewed cookie. Clients serialize refresh.
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '200':
          description: Rotated refresh cookie and access token
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /auth/logout:
    post:
      tags: [Auth]
      security: []
      operationId: logout
      description: >-
        Revokes the session identified by the optional ecom_refresh cookie and clears
        it; no access JWT is required. Missing or invalid cookie still returns 204
        after Origin/custom-header checks. Existing access tokens fail session checks.
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '204':
          description: Session revoked if present and cookie cleared
          headers:
            Set-Cookie:
              description: ecom_refresh cleared with matching path/security attributes and Max-Age=0
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /users/me:
    get:
      tags: [Account]
      operationId: getMe
      responses:
        '200':
          description: Account profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Account]
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
