openapi: 3.0.3
info:
  title: Commerce Reliability Lab - Order Processing API
  version: 1.7.0
  description: >-
    Project 1 REST contract. USD-only, deterministic simulated payments, PostgreSQL
    reservations and synchronous checkout. No payment provider or background queues.
    Schema/readiness 13 adds guest checkout and exact-target mailbox recovery, using the
    shared simulated payments, reservation transitions and operator reconciliation.
    Design and trade-offs are recorded in docs/api/README.md and docs/DECISIONS.md.
    Unknown input fields and null values are rejected; empty PATCH objects return 422.
    Omitted PATCH fields are unchanged; empty strings clear optional text.
    Validly shaped out-of-range values return 422, malformed JSON/types return 400.
    Authentication failures return 401, role/CSRF denials 403, oversized bodies 413,
    throttling 429, and unexpected server failures 500, using the Error schema.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Account
  - name: Products
  - name: Cart
  - name: Checkout
  - name: Orders
  - name: Guest
paths:
  /guest/checkout-intents:
    post:
      operationId: prepareGuestCheckout
      description: Save reference locally first. Immutable server shipping/contact preparation, NOT order creation,
        payment or stock reservation. Identical same-key preparation returns 200, new 201, changed body/key binding
        409 idempotency_conflict. One prepared intent per guest; retired IDs cannot be resurrected.
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/CsrfProtection'
        - $ref: '#/components/parameters/GuestIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestPreparation'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '200':
          $ref: '#/components/responses/GuestIntentResponse'
        '201':
          $ref: '#/components/responses/GuestIntentResponse'
      security:
        - guestCookie: []
      tags:
        - Guest
  /guest/checkout-intents/{id}:
    parameters:
      - $ref: '#/components/parameters/GuestIntentId'
    get:
      operationId: getGuestCheckoutIntent
      security:
        - guestCookie: []
        - guestRecoveryCookie: []
      description: Owned original preparation, committed locator or closed state. Recovery grant must match this exact
        intent. 404 does not prove a delayed preparation/checkout cannot commit; explicit retirement is the fence.
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '200':
          $ref: '#/components/responses/GuestIntentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Guest
  /guest/checkout-intents/{id}/retire:
    parameters:
      - $ref: '#/components/parameters/GuestIntentId'
    post:
      operationId: retireGuestCheckoutIntent
      security:
        - guestCookie: []
        - guestRecoveryCookie: []
      description: Explicit original-key retirement under owner/key locks. Returns matching committed order instead
        of closing it; otherwise commits retired state, including a tombstone for missing preparation with a full
        owner credential. Late messages cannot resurrect. Recovery scope must match the existing target. Uncertainty
        preserves local record.
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/CsrfProtection'
        - $ref: '#/components/parameters/GuestIdempotencyKey'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '200':
          description: Authoritative retirement or known-order handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestRetirement'
      tags:
        - Guest
  /guest/checkout:
    post:
      operationId: checkoutGuest
      security:
        - guestCookie: []
        - guestRecoveryCookie: []
      description: Full owner or exact intent recovery scope. Same original key/reference/body only; committed lookup
        precedes current-cart/expired-intent refusal. Reuses T1/claim/T2. Replay never restarts interrupted processing.
        Save durable known-order before navigation; 200/201 may contain payment_failed and 202 contains pending_payment.
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/CsrfProtection'
        - $ref: '#/components/parameters/GuestIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestCheckoutReference'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/CheckoutOutcomeUncertain'
        '200':
          $ref: '#/components/responses/GuestOrderResponse'
        '201':
          $ref: '#/components/responses/GuestOrderResponse'
        '202':
          $ref: '#/components/responses/GuestOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Guest
  /guest/orders:
    get:
      operationId: listGuestOrders
      description: Full guest credential only; newest created_at/id first. Recovery scope cannot list history.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '200':
          description: Owned guest orders, unchanged Order snapshots
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/Order'
      security:
        - guestCookie: []
      tags:
        - Guest
  /guest/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getGuestOrder
      security:
        - guestCookie: []
        - guestRecoveryCookie: []
      description: Full owner or exact order/result-of-intent scope, not email or order ID as authorization.
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '200':
          $ref: '#/components/responses/GuestOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Guest
  /guest/orders/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getGuestOrderPayments
      security:
        - guestCookie: []
        - guestRecoveryCookie: []
      description: Same exact ownership/scope as order detail; one simulated attempt, no payment actions.
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '200':
          description: Authoritative attempts
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 1
                items:
                  $ref: '#/components/schemas/PaymentAttempt'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Guest
  /guest/orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: cancelGuestOrder
      security:
        - guestCookie: []
        - guestRecoveryCookie: []
      description: Bodyless; same existing pending-only/claim conflict rules. Explicit same-order retry only.
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/OrderOutcomeUncertain'
        '200':
          $ref: '#/components/responses/GuestOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Guest
  /guest/recovery-requests:
    post:
      operationId: requestGuestRecovery
      security: []
      description: Non-disclosing email+one-reference request. Always same 202 body/8s response floor for eligible/ineligible/target
        quota suppression, no target details. Global delivery-off 503/peer 429 are eligibility-independent. No cookies
        changed. Fifteen-minute single-use proof; trusted-origin /guest/recover#token= link.
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestRecoveryRequest'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '202':
          description: Generic receipt, not proof of delivery or existence
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - message
                properties:
                  message:
                    type: string
                    enum:
                      - If the reference and email are eligible, recovery instructions will be sent.
      tags:
        - Guest
  /guest/recovery-confirmations:
    post:
      operationId: confirmGuestRecovery
      security: []
      description: Consume one proof, issue 30-minute exact-target ecom_guest_recovery cookie. No login/full-guest/cart/account
        grant or unrelated-cookie changes. All invalid proofs return 400 invalid_guest_proof; lost reply uses GET
        recovery-access or a new requested proof, never automatic token replay. GET consumes nothing.
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 43
                  maxLength: 43
                  pattern: ^[A-Za-z0-9_-]{43}$
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '200':
          $ref: '#/components/responses/GuestRecoveryAccessResponse'
      tags:
        - Guest
  /guest/recovery-access:
    get:
      operationId: getGuestRecoveryAccess
      security:
        - guestRecoveryCookie: []
      description: Verify current exact-target grant; no extension, cookie issuance or full-owner restoration.
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '200':
          $ref: '#/components/responses/GuestRecoveryAccessResponse'
      tags:
        - Guest
    delete:
      operationId: endGuestRecoveryAccess
      security: []
      description: Bodyless; revoke/clear only the recovery grant; missing grant also 204.
      parameters:
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '204':
          description: Recovery access ended
      tags:
        - Guest
  /guest/session:
    get:
      operationId: getGuestSession
      description: Verify full guest cookie; never creates, rotates or sets cookies. Invalid/missing/expired is 401.
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '200':
          $ref: '#/components/responses/GuestSessionResponse'
      security:
      - guestCookie: []
      tags:
      - Guest
    post:
      operationId: createGuestSession
      security: []
      description: Bodyless, explicit bootstrap. Missing cookie creates 201; a valid full cookie returns the same
        principal/deadline with 200. Invalid/duplicate supplied cookie returns 401, never replacement. Creation sets
        only ecom_guest.
      parameters:
      - $ref: '#/components/parameters/BrowserOrigin'
      - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '200':
          $ref: '#/components/responses/GuestSessionResponse'
        '201':
          $ref: '#/components/responses/GuestSessionResponse'
      tags:
      - Guest
    delete:
      operationId: endGuestSession
      security: []
      description: Bodyless; deliberately revoke/clear only presented full guest cookie, even absent/expired/unrecognized;
        duplicate cookies fail closed. Preserve intents and unrelated cookies.
      parameters:
      - $ref: '#/components/parameters/BrowserOrigin'
      - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '204':
          description: Guest session ended; repeated missing-session end is also 204
      tags:
      - Guest
  /guest/session/rotate:
    post:
      operationId: rotateGuestSession
      description: Bodyless; replace full verifier, preserving guest/cart/absolute deadline. No automatic replay.
      parameters:
      - $ref: '#/components/parameters/BrowserOrigin'
      - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '200':
          $ref: '#/components/responses/GuestSessionResponse'
      security:
      - guestCookie: []
      tags:
      - Guest
  /guest/cart:
    get:
      operationId: getGuestCart
      description: Full credential only; consistent parent-locked cart, never creates or accepts recovery scope.
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '200':
          $ref: '#/components/responses/GuestCartResponse'
      security:
      - guestCookie: []
      tags:
      - Guest
  /guest/cart/items:
    post:
      operationId: addGuestCartItem
      description: Deliberate additive mutation; 100 lines/10000 quantity, no reservation or stock cap.
      parameters:
      - $ref: '#/components/parameters/BrowserOrigin'
      - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestCartAddInput'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '200':
          $ref: '#/components/responses/GuestCartResponse'
      security:
      - guestCookie: []
      tags:
      - Guest
    delete:
      operationId: clearGuestCart
      description: Bodyless; clear owned cart and increment once; explicit fresh read after 204.
      parameters:
      - $ref: '#/components/parameters/BrowserOrigin'
      - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '204':
          description: Cart cleared
      security:
      - guestCookie: []
      tags:
      - Guest
  /guest/cart/items/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    - $ref: '#/components/parameters/BrowserOrigin'
    - $ref: '#/components/parameters/CsrfProtection'
    patch:
      operationId: replaceGuestCartItem
      description: Full credential, owned item ID, resulting quantity. No automatic replay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestCartReplacementInput'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '200':
          $ref: '#/components/responses/GuestCartResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - guestCookie: []
      tags:
      - Guest
    delete:
      operationId: removeGuestCartItem
      description: Bodyless; owned item only, including unavailable products; explicit read after 204.
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/GuestUnavailable'
        '204':
          description: Item removed
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - guestCookie: []
      tags:
      - Guest
  /guest/cart-choice:
    get:
      operationId: getGuestCartChoice
      security:
      - bearerAuth: []
        guestCookie: []
      description: Requires both current account session and full guest cookie; no transfer by GET.
      responses:
